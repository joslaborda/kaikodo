workflows:
  # ── Android ────────────────────────────────────────────────────────────
  # Genera un .aab firmado listo para subir a Play Console (track interno).
  # Antes del primer build hay que subir el keystore de firma en Codemagic
  # (Teams > Code signing identities > Android) y crear el grupo de
  # variables "kodo_env" (ver más abajo) con las mismas claves que tu
  # .env.local.
  kodo-android:
    name: Kaikōdo — Android
    max_build_duration: 30
    environment:
      groups:
        - kodo_env # VITE_BASE44_APP_ID, VITE_BASE44_APP_BASE_URL, VITE_ONESIGNAL_APP_ID
        - google_play # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (JSON de la service account)
      android_signing:
        - kodo_keystore # nombre que le des al keystore al subirlo en Codemagic
      node: latest
      java: 21 # Capacitor 8 / AGP necesitan Java 21 para compilar — sin esto
               # falla con "invalid source release: 21" (la máquina usa un
               # Java más antiguo por defecto)
    scripts:
      - name: Instalar dependencias
        script: npm install
      - name: Build del frontend (Vite)
        script: npm run build
      - name: Sincronizar Capacitor (copia dist/ al proyecto Android)
        script: npx cap sync android
      - name: Incrementar versionCode de Android
        script: |
          LATEST_BUILD_NUMBER=$(google-play get-latest-build-number --package-name "com.kaikodo.app" --credentials="$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" --tracks="internal")
          NEW_VERSION_CODE=$(( ${LATEST_BUILD_NUMBER:-0} + 1 ))
          sed -i '' "s/versionCode [0-9]*/versionCode $NEW_VERSION_CODE/" android/app/build.gradle
      - name: Build del .aab firmado
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - jlabord@gmail.com
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false

  # ── iOS ────────────────────────────────────────────────────────────────
  # Necesita, ya configurados en Codemagic (Teams > Code signing identities
  # > iOS), un certificado de distribución y un perfil de aprovisionamiento
  # asociados a tu cuenta de Apple Developer — no se puede completar este
  # workflow hasta tener esa cuenta dada de alta (ver LEEME_CAPACITOR_PUSH.md).
  kodo-ios:
    name: Kaikōdo — iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      groups:
        - kodo_env
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.kaikodo.app
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependencias
        script: npm install
      - name: Build del frontend (Vite)
        script: npm run build
      - name: Sincronizar Capacitor (copia dist/ al proyecto iOS)
        script: npx cap sync ios
      - name: Ajustar firma automática con los perfiles de Codemagic
        script: |
          xcode-project use-profiles
      - name: Incrementar número de build
        script: |
          cd ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number 6798173537 --platform=IOS)
          agvtool new-version -all $((LATEST_BUILD_NUMBER + 1))
      - name: Build del .ipa firmado
        script: |
          xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - jlabord@gmail.com
      # Cuando tengas cuenta de Apple Developer y hayas conectado la
      # integración con App Store Connect (Teams > Integrations > App Store
      # Connect en Codemagic, le pones un nombre, ej. "kodo_asc"), descomenta
      # esto y pon ese mismo nombre en "auth":
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # --- iOS test build (simulador, sin firma) ------------------------------
  # No necesita cuenta de Apple Developer ni certificados: compila para el
  # simulador de iOS solo para validar que el proyecto Capacitor/CocoaPods
  # compila sin errores, antes de tener la cuenta de pago activa.
  kodo-ios-simulator:
    name: Kaikōdo - iOS (test simulador, sin firma)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      groups:
        - kodo_env
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependencias
        script: npm install
      - name: Build del frontend (Vite)
        script: npm run build
      - name: Sincronizar Capacitor (copia dist/ al proyecto iOS)
        script: npx cap sync ios
      - name: Build para simulador (sin firma, solo valida que compila)
        script: |
          cd ios/App
          xcodebuild build -project App.xcodeproj -scheme App -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
    artifacts:
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - jlabord@gmail.com
